name: AR teacher distillation experiment
on:
  push:
    branches: [experiment/ar-distillation]
    paths: ['byod-distillation/**', '.github/workflows/ar-distillation.yml']
  pull_request:
    paths: ['byod-distillation/**', '.github/workflows/ar-distillation.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: byod-distillation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: byod-distillation/pyproject.toml
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,evaluation]'
      - run: python -m pytest -q
      - run: python train.py --model llama --mode quick --config configs/distillation.yaml --print-config
