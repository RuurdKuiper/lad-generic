# Short Colab experiment; shared settings for baseline and teacher runs.
# Use teacher weight 0 in the notebook for an otherwise identical baseline.
max_updates: 500
batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
train_normalization_layers: false
num_workers: 2
warmup_steps: 25
logging_steps: 1
validation_steps: 50
checkpoint_steps: 50
validation_samples: 100
generation_perplexity: {enabled: false}
distillation:
  enabled: true
  weight: 0.5
  temperature: 1.0
  chunk_size: 64
