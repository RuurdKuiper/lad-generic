[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "byod-diffusion"
version = "0.1.0"
description = "Build Your Own DLM: single-GPU conversion of instruction LMs into masked diffusion models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "transformers>=4.46,<5",
  "peft>=0.15",
  "accelerate>=1.12",
  "huggingface-hub>=0.34",
  "datasets>=4.1",
  "PyYAML>=6",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
colab = [
  "bitsandbytes>=0.45",
  "transformer-engine[pytorch]==2.13.0",
]
test = ["pytest>=8"]

[tool.setuptools.package-data]
diffusion_lm = ["generation_prompts.txt"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
