outputs_dir: outputs
models: []  # Empty means discover every outputs/**/best adapter. Add "llada:...", "legacy:/path/...", or "legacy-hf:repo|filename.pth" explicitly.
legacy_tokenizer_name_or_path: meta-llama/Llama-3.2-3B
# tasks: [mmlu, mmlu_pro, hellaswag, arc_c, gsm8k, math, gpqa, humaneval, mbpp, open_ended]
tasks: [arc_c]  # Options: mmlu, mmlu_pro, hellaswag, arc_c, gsm8k, math, gpqa, humaneval, mbpp, open_ended
split: test
limit: 10
# Use `limit_fraction: 0.05` instead of `limit` for an evenly-spaced 1/20 smoke sample of every task.
# limit_fraction: 0.05
device: auto  # Options: auto, cuda, mps, cpu
cache_dir: data/huggingface
results_path: outputs/benchmark_results.jsonl
include_autoregressive: false  # Options: true, false
show_open_ended_answers: true  # Set true to print each open-ended prompt and final answer as it completes.
perplexity:
  model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
  tokenizer_name_or_path: meta-llama/Llama-3.1-8B-Instruct
  quantization: none  # Use 4bit to reduce GPU memory usage; the same reference model is used for every run.
  precision: fp16
  cache_dir: base_models
generation:
  max_new_tokens: 128
  num_steps: 32
  noise_level: 0.5
  temperature: 0.7
  top_k: 3
  seed: 1234
  proportional_unmask: true  # Options: true, false
generation_by_corruption:
  # These override `generation` for runs with the matching corruption_mode.
  # Mask-only runs also force noise_level=1.0, permanent_unmask=true, and
  # confidence_guided=true in the evaluator.
  structured:
    noise_level: 0.5
    temperature: 0.7
    top_k: 100
    proportional_unmask: true
    permanent_unmask: false
    confidence_guided: false
  mask_only:
    noise_level: 1.0
    temperature: 0.5
    top_k: 100
    proportional_unmask: false
    permanent_unmask: true
    confidence_guided: true
task_generation:
  open_ended: {max_new_tokens: 128, num_steps: 32}
  mmlu: {max_new_tokens: 64, num_steps: 32}
  mmlu_pro: {max_new_tokens: 256, num_steps: 256}
  hellaswag: {max_new_tokens: 64, num_steps: 32}
  arc_c: {max_new_tokens: 64, num_steps: 32}
  gsm8k: {max_new_tokens: 512, num_steps: 512}
  math: {max_new_tokens: 512, num_steps: 512}
  gpqa: {max_new_tokens: 64, num_steps: 64}
  humaneval: {max_new_tokens: 512, num_steps: 512}
  mbpp: {max_new_tokens: 256, num_steps: 256}
