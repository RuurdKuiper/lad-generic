outputs_dir: outputs
models: []  # Empty means discover every outputs/**/best adapter. Add e.g. "llada:GSAI-ML/LLaDA-8B-Instruct" explicitly.
# tasks: [mmlu, mmlu_pro, hellaswag, arc_c, gsm8k, math, gpqa, humaneval, mbpp, open_ended]
tasks: [arc_c]  # Options: mmlu, mmlu_pro, hellaswag, arc_c, gsm8k, math, gpqa, humaneval, mbpp, open_ended
split: test
limit: 10
device: auto  # Options: auto, cuda, mps, cpu
cache_dir: data/huggingface
results_path: outputs/benchmark_results.jsonl
include_autoregressive: true  # Options: true, false
show_open_ended_answers: false  # Set true to print each open-ended prompt and final answer as it completes.
generation:
  max_new_tokens: 256
  num_steps: 256
  noise_level: 0.5
  temperature: 0.7
  top_k: 3
  seed: 1234
  proportional_unmask: true  # Options: true, false
generation_by_corruption:
  # These override `generation` for runs with the matching corruption_mode.
  # Mask-only runs also force noise_level=1.0, permanent_unmask=true, and
  # confidence_guided=true in the evaluator.
  structured:
    noise_level: 0.5
    temperature: 0.7
    top_k: 100
    proportional_unmask: true
    permanent_unmask: false
    confidence_guided: false
  mask_only:
    noise_level: 1.0
    temperature: 0.5
    top_k: 100
    proportional_unmask: false
    permanent_unmask: true
    confidence_guided: true
task_generation:
  open_ended: {max_new_tokens: 256, num_steps: 256}
  mmlu: {max_new_tokens: 3, num_steps: 3}
  mmlu_pro: {max_new_tokens: 256, num_steps: 256}
  hellaswag: {max_new_tokens: 3, num_steps: 3}
  arc_c: {max_new_tokens: 32, num_steps: 32}
  gsm8k: {max_new_tokens: 512, num_steps: 512}
  math: {max_new_tokens: 512, num_steps: 512}
  gpqa: {max_new_tokens: 64, num_steps: 64}
  humaneval: {max_new_tokens: 512, num_steps: 512}
  mbpp: {max_new_tokens: 256, num_steps: 256}
