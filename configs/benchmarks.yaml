outputs_dir: outputs
models: []  # Empty means discover every outputs/**/best adapter.
# To compare an adapter with official LLaDA, list both explicitly:
# models: ["llama-3.1-8b-mask/best", "llada:GSAI-ML/LLaDA-8B-Instruct"]
legacy_tokenizer_name_or_path: meta-llama/Llama-3.2-3B
# tasks: [mmlu, mmlu_pro, hellaswag, arc_c, gsm8k, math, gpqa, humaneval, mbpp, open_ended]
tasks: [arc_c]  # Options: mmlu, mmlu_pro, hellaswag, arc_c, gsm8k, math, gpqa, humaneval, mbpp, open_ended
split: test
limit: 10
# Use `limit_fraction: 0.05` instead of `limit` for an evenly-spaced 1/20 smoke sample of every task.
# limit_fraction: 0.05
device: auto  # Options: auto, cuda, mps, cpu
cache_dir: data/huggingface
results_dir: outputs/benchmark_runs  # Each invocation creates its own timestamped directory here.
# run_name: arc-smoke  # Optional readable suffix for the timestamped run ID.
include_autoregressive: false  # Options: true, false
show_open_ended_answers: true  # Set true to print each open-ended prompt and final answer as it completes.
perplexity:
  # Independent 14B reference model used only after open-ended generation.
  model_name_or_path: microsoft/phi-4
  tokenizer_name_or_path: microsoft/phi-4
  quantization: 4bit  # Keeps the 14B judge practical on a single validation GPU.
  precision: bf16
  cache_dir: base_models
generation:
  max_new_tokens: 128
  num_steps: 32
  noise_level: 0.5
  temperature: 0.7
  top_k: 3
  seed: 1234
  proportional_unmask: true  # Options: true, false
generation_by_corruption:
  # These override `generation` for runs with the matching corruption_mode.
  # Mask-only runs also force noise_level=1.0, permanent_unmask=true, and
  # confidence_guided=true in the evaluator.
  structured:
    noise_level: 0.5
    temperature: 0.7
    top_k: 100
    proportional_unmask: true
    permanent_unmask: false
    confidence_guided: false
  mask_only:
    # Mask-only adapters use the official LLaDA fixed-budget sampler below.
    # These legacy-loop fields are retained only for older evaluator versions.
    noise_level: 1.0
    temperature: 0.5
    top_k: 100
    proportional_unmask: false
    permanent_unmask: true
    confidence_guided: true
# Our mask-only adapters use the same fixed-budget low-confidence sampler and
# automatic per-task profiles as hosted LLaDA. Their own chat template and
# native EOS/end-of-turn token IDs are used.
mask_only_generation:
  temperature: 0.0
  cfg_scale: 0.0
  remasking: low_confidence
# mask_only_task_generation:
#   gsm8k: {max_new_tokens: 256, num_steps: 256, block_length: 8, confidence_eos_eot_inf: false}
# Hosted LLaDA bypasses the generic mask-only loop and uses the official
# fixed-budget low-confidence sampler. Published per-task lengths, steps, and
# EOS settings are selected automatically; these fields are explicit overrides.
llada_generation:
  temperature: 0.0
  cfg_scale: 0.0
  remasking: low_confidence
  eot_token_id: 126348
# llada_task_generation:
#   gsm8k: {max_new_tokens: 256, num_steps: 256, block_length: 8, confidence_eos_eot_inf: false}  # Official optional block-diffusion variant.
task_generation:
  open_ended: {max_new_tokens: 128, num_steps: 32}
  mmlu: {max_new_tokens: 64, num_steps: 32}
  mmlu_pro: {max_new_tokens: 256, num_steps: 256}
  hellaswag: {max_new_tokens: 64, num_steps: 32}
  arc_c: {max_new_tokens: 64, num_steps: 32}
  gsm8k: {max_new_tokens: 512, num_steps: 512}
  math: {max_new_tokens: 512, num_steps: 512}
  gpqa: {max_new_tokens: 64, num_steps: 64}
  humaneval: {max_new_tokens: 512, num_steps: 512}
  mbpp: {max_new_tokens: 256, num_steps: 256}
