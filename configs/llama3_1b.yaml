model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
tokenizer_name_or_path: meta-llama/Llama-3.2-1B-Instruct
dataset_name: Ruurd/LAD-training
cache_dir: data/huggingface
base_model_cache_dir: base_models
splits: {train: train, validation: validation, test: test}
corruption_mode: structured  # Llama-compatible stored IDs only
structured_loss_behavior: all_tokens
output_dir: outputs/llama-3.2-1b-structured
seed: 42
max_sequence_length: 256
t_min: 0.1
include_answer_eos: true
lora_r: 64
lora_alpha: 64
lora_dropout: 0.05
lora_targets: [q_proj, v_proj, o_proj]
learning_rate: 1.0e-5
scheduler: linear
warmup_steps: 100
batch_size: 8
eval_batch_size: 8
gradient_accumulation_steps: 1
epochs: 1
precision: bf16
gradient_checkpointing: true
train_normalization_layers: true

# Perplexity evaluation during training
generation_perplexity:
  enabled: true
  num_prompts: 5
  num_steps: 32
  max_new_tokens: 128
  noise_level: 0.5
  temperature: 0.7
  top_k: 3
  seed: 1234
  prompts:
    - "What do you know about Amsterdam?"
    - "Tell me a story about a little dwarf."
    - "Why is the sky blue?"
    - "Explain how plants grow."
    - "What makes a good friend?"
logging_steps: 10
validation_steps: 20
checkpoint_steps: 20
checkpoint_mode: only_best_model
# resume_from_adapter: outputs/llama-3.2-1b-structured/best
num_workers: 4

# Quantization
quantization: 4bit
optimizer: adamw8bit
gradient_checkpointing: true
batch_size: 1
gradient_accumulation_steps: 8
