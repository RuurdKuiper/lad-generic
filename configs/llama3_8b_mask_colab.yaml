# Base model
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
tokenizer_name_or_path: meta-llama/Llama-3.1-8B-Instruct
resume_from_adapter: outputs/llama-3.1-8b-mask/checkpoint-10000

# Dataset
dataset_name: Ruurd/LAD-training
splits: {train: train, validation: validation, test: test}

# File paths
cache_dir: data/huggingface
base_model_cache_dir: base_models
validation_samples: 200

# Corruption and loss behavior
corruption_mode: mask_only  # Options: structured, mask_only
structured_loss_behavior: corrupted_answer_tokens  # Options: all_answer_tokens, corrupted_answer_tokens, all_tokens
eos_padding_loss: true  # Options: true, false
output_dir: outputs/llama-3.1-8b-mask-continued
seed: 42
t_min: 0.001
include_answer_eos: true

# Include multi-turn
multi_turn_prob: 0.0
max_history_turns: 2

lora_dropout: 0.0
lora_targets: [q_proj, v_proj]
learning_rate: 1.0e-5
scheduler: cosine  # Options: any Transformers SchedulerType (linear, cosine, constant, ...)
warmup_steps: 100
num_workers: 4
epochs: 1
# Optional cap expressed in optimizer/gradient updates, not micro-batches.
# Set a positive integer (for example 1000) to end cleanly after that many
# updates and release the Slurm allocation; leave null to use the full epoch.
max_updates: 100000

# Training parameters influencing memory usage
max_sequence_length: 256
lora_r: 2048
lora_alpha: 2048
train_normalization_layers: false
batch_size: 8
eval_batch_size: 8
gradient_accumulation_steps: 1
gradient_checkpointing: false

# Logging and checkpointing
logging_steps: 10
validation_steps: 250
checkpoint_steps: 5000
checkpoint_mode: every_model  # Options: only_best_model, every_checkpoint, every_model

# Perplexity evaluation during training
generation_perplexity:
  enabled: true
  num_prompts: 5
  num_steps: 32
  max_new_tokens: 64
  noise_level: 1.0
  temperature: 1.0
  top_k: 100
  permanent_unmask: true
  confidence_guided: true
  seed: 1234
  prompts:
    - "What do you know about Amsterdam?"
    - "Tell me a story about a little dwarf."
    - "Why is the sky blue?"
    - "Explain how plants grow."
    - "What makes a good friend?"


# Quantization
precision: fp16  # Options: fp16, bf16, fp32
quantization: none  # Options: none, 4bit
optimizer: adamw  # Options: adamw, adamw8bit
weight_decay: 0.01
max_grad_norm: 0.5
