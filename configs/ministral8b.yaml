model_name_or_path: mistralai/Ministral-8B-Instruct-2410
tokenizer_name_or_path: mistralai/Ministral-8B-Instruct-2410
dataset_name: Ruurd/LAD-training-100k-256
cache_dir: data/huggingface
base_model_cache_dir: base_models
splits: {train: train, validation: validation, test: test}
validation_samples: 200
corruption_mode: mask_only  # Ministral cannot use the Llama-tokenized structured rows.
mask_token: "<?>"  # Tekken encodes this uncommon vocabulary marker as one token; "MASK" is two.
structured_loss_behavior: all_answer_tokens  # Options: all_answer_tokens, corrupted_answer_tokens, all_tokens
eos_padding_loss: false  # Options: true, false
output_dir: outputs/ministral-8b-mask-only
seed: 42
max_sequence_length: 512
t_min: 0.001
include_answer_eos: true
lora_r: 1024
lora_alpha: 1024
lora_dropout: 0.05
lora_targets: [q_proj, v_proj]
learning_rate: 1.0e-5
scheduler: linear  # Options: any Transformers SchedulerType (linear, cosine, constant, ...)
warmup_steps: 100
batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 16
epochs: 1
precision: bf16  # Options: fp16, bf16, fp32
gradient_checkpointing: true
train_normalization_layers: true
generation_perplexity:
  enabled: false
  num_prompts: 5
  num_steps: 32
  max_new_tokens: 128
  noise_level: 0.5
  temperature: 0.7
  top_k: 20
  seed: 1234
logging_steps: 10
validation_steps: 50
checkpoint_steps: 250
checkpoint_mode: only_best_model  # Options: only_best_model, every_checkpoint, every_model
num_workers: 4
