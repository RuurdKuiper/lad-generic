# Base model: text-only Ministral 8B, not a Pixtral/multimodal checkpoint.
model_name_or_path: mistralai/Ministral-8B-Instruct-2410
tokenizer_name_or_path: mistralai/Ministral-8B-Instruct-2410

# Dataset
dataset_name: Ruurd/LAD-training-1m-256
splits: {train: train, validation: validation, test: test}

# File paths
cache_dir: data/huggingface
base_model_cache_dir: base_models
validation_samples: 200

# Corruption and loss behavior
corruption_mode: mask_only  # Ministral cannot use the Llama-tokenized structured rows.
mask_token: "<?>"  # Tekken encodes this uncommon vocabulary marker as one token; "MASK" is two.
structured_loss_behavior: corrupted_answer_tokens  # Options: all_answer_tokens, corrupted_answer_tokens, all_tokens
eos_padding_loss: true  # Options: true, false
output_dir: outputs/ministral-8b-mask
seed: 42
t_min: 0.001
include_answer_eos: true

# Include multi-turn
multi_turn_prob: 0.0
max_history_turns: 2

lora_dropout: 0.0
lora_targets: [q_proj, v_proj]
learning_rate: 1.0e-5
# Treat learning_rate as the rate for the reference effective batch size.
learning_rate_scaling:
  enabled: false
  mode: sqrt  # Options: sqrt, linear
  reference_batch_size: 8
scheduler: cosine  # Options: any Transformers SchedulerType (linear, cosine, constant, ...)
warmup_steps: 100
num_workers: 4
prefetch_factor: 4
epochs: 1
# Optional cap expressed in optimizer/gradient updates, not micro-batches.
# Set a positive integer (for example 1000) to end cleanly after that many
# updates and release the allocation; leave null to use the full epoch.
max_updates: 25000

# Training parameters influencing memory usage
max_sequence_length: 256
pad_to_multiple_of: 16  # Required for Transformer Engine FP8 matrix dimensions.
lora_r: 1024
lora_alpha: 1024
train_normalization_layers: false
batch_size: 16
eval_batch_size: 8
gradient_accumulation_steps: 1
gradient_checkpointing: false
selected_logit_optimization: true

# Logging and checkpointing
logging_steps: 100
validation_steps: 250
checkpoint_steps: 1000
checkpoint_mode: every_model  # Options: only_best_model, every_checkpoint, every_model

# Perplexity evaluation during training
generation_perplexity:
  enabled: true
  interval_steps: 1000
  num_prompts: 20
  num_steps: 32
  max_new_tokens: 64
  noise_level: 1.0
  temperature: 0.5
  top_k: 3
  permanent_unmask: true
  confidence_guided: true
  proportional_unmask: false
  seed: 1234

# Quantization
precision: bf16  # Master weights and unsupported-GPU fallback precision.
fp8:
  enabled: true
  backend: transformer_engine
  format: HYBRID
quantization: none  # Options: none, 4bit
optimizer: adamw  # Options: adamw, adamw8bit
weight_decay: 0.01
max_grad_norm: 0.5
