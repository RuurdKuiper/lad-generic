[project]
name = "diffusion-lm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "transformers>=4.38.2,<5", "peft>=0.15", "accelerate>=1.12", "datasets>=4.1", "PyYAML>=6", "python-dotenv>=1.0", "tqdm>=4.66", "gradio>=5.0", "matplotlib>=3.7"]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.45"]
# Transformer Engine 2.14+ PyPI Torch bindings require the CUDA 13 core.
# Colab currently ships CUDA 12; 2.13 is the latest CUDA-12 Torch build and
# includes Blackwell/SM120 support.
fp8 = ["transformer-engine[pytorch]==2.13.0"]
evaluation = ["math-verify[antlr4_13_2]>=0.8", "openai>=1.68"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
diffusion_lm = ["generation_prompts.txt"]
